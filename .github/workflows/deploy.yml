name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar en Cloudflare
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Revisar credenciales
        id: credenciales
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN: no se despliega." >> "$GITHUB_STEP_SUMMARY"
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.credenciales.outputs.listo == 'true'
      - uses: actions/setup-node@v4
        if: steps.credenciales.outputs.listo == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.credenciales.outputs.listo == 'true'
      - run: npm test
        if: steps.credenciales.outputs.listo == 'true'
      # Usa el wrangler fijado en package-lock.json, no el que trae una acción.
      - name: Desplegar con wrangler
        if: steps.credenciales.outputs.listo == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
